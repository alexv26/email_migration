# Render Blueprint for the mail-transfer web app.
# Deploy: connect this repo in the Render dashboard -> "New Blueprint Instance".
#
# Cost-optimized layout: the web server and the background job worker run as
# TWO PROCESSES IN ONE Render service (see start_combined.sh) instead of two
# separate services, and Redis runs on Render's free Key Value tier. This
# gets total cost down to the Starter web service alone (~$7/mo) at the
# expense of some resilience - see start_combined.sh's comment, and note the
# free Key Value tier's data is lost on restart (acceptable here since job
# data is meant to be short-lived anyway, but a restart mid-migration means
# resubmitting).
#
# After the first deploy, set these `sync: false` values once in the Render
# dashboard, on the `mail-transfer-shared` env var group:
#   APP_PASSWORD    - the shared invite password you give to your group
#   SESSION_SECRET  - random string, e.g. `python -c "import secrets; print(secrets.token_urlsafe(32))"`
#   FERNET_KEY      - `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`

envVarGroups:
  - name: mail-transfer-shared
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: MAX_THREADS
        value: "5"
      - key: JOB_TIMEOUT_SECONDS
        value: "21600"

services:
  - name: mail-transfer-web
    type: web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_combined.sh
    healthCheckPath: /healthz
    envVars:
      - fromGroup: mail-transfer-shared
      - key: REDIS_URL
        fromService:
          name: mail-transfer-redis
          type: keyvalue
          property: connectionString
      - key: RESULT_TTL_SECONDS
        value: "600"
      - key: FAILURE_TTL_SECONDS
        value: "600"
      - key: SUBMIT_RATE_LIMIT_PER_HOUR
        value: "3"
      - key: LOGIN_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: COOKIE_SECURE
        value: "true"

  - name: mail-transfer-redis
    type: keyvalue
    plan: free
    region: oregon
    ipAllowList: []
