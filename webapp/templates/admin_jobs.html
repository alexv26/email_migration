{% extends "base.html" %}
{% block title %}Admin - Jobs{% endblock %}
{% block content %}
  <h1>Jobs</h1>
  <p class="hint">Active and recently-finished migrations. Credentials and account emails are never shown here - only folder/message progress.</p>

  <table id="jobs-table">
    <thead>
      <tr><th>Job</th><th>Status</th><th>Folders</th><th>Started</th><th>Error</th><th></th></tr>
    </thead>
    <tbody id="jobs-body">
      <tr><td colspan="6" class="hint">Loading…</td></tr>
    </tbody>
  </table>

  <form method="post" action="/admin/logout" class="logout"><button type="submit">Log out</button></form>

  <script src="/static/admin_jobs.js"></script>
{% endblock %}
